[package]
name = "siouxdb"
description = "SiouxDB: banco de dados relacional embutido, num arquivo só, cifrado por padrão, verificável e com histórico consultável."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["database", "embedded", "sql", "encryption", "ledger"]
categories = ["database-implementations"]

[features]
default = []
# Serialização (JSON) das fotos do painel, usada pelo Studio e pelo servidor.
serde = ["siouxdb-metricas/serde"]

[dependencies]
siouxdb-vfs.workspace = true
siouxdb-armazenamento.workspace = true
siouxdb-metricas.workspace = true
siouxdb-transacoes.workspace = true
siouxdb-indices.workspace = true
siouxdb-catalogo.workspace = true
siouxdb-sql.workspace = true

[lints]
workspace = true
