[package]
name = "sioux-microservico"
description = "Microserviço de exemplo: API HTTP/JSON sobre um banco SiouxDB embutido."
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
siouxdb = { path = "../../crates/siouxdb" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
